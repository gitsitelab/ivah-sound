# Fetches the media from the old Ivah Sound sites into archive/ (only what is
# missing, and commits it so it is kept for good), builds the site and
# publishes it to GitHub Pages.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install pillow beautifulsoup4
          npm install --no-audit --no-fund
      - name: Import media from the old sites into archive/
        run: python tools/import_media.py
      - name: Keep the archive in the repository
        run: |
          git add archive
          if ! git diff --cached --quiet; then
            git config user.name "ivah-archive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive media from the old Ivah Sound sites"
            git push
          fi
      - name: Build
        run: python tools/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
